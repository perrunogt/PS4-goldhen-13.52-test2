<!DOCTYPE html>
<html lang="es" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<title>perrunoGT · PS4 Exploit</title>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.10), transparent 42%), #020604;
    color: #dfffea;
    font-size: 20px;
    text-align: center;
    font-family: monospace;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(0, 255, 136, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 255, 136, 0.035);
    filter: blur(80px);
    pointer-events: none;
}

.info {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(82vw, 620px);
    padding: 32px 28px;
    font-size: 20px;
    font-family: monospace;
    color: #00ff88;
    transform: translate(-50%, -50%);
    background: rgba(2, 12, 7, 0.94);
    border: 1px solid rgba(0, 255, 136, 0.35);
    border-radius: 18px;
    box-shadow:
        0 0 50px rgba(0, 255, 136, 0.08),
        0 25px 70px rgba(0, 0, 0, 0.75),
        inset 0 0 30px rgba(0, 255, 136, 0.025);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.55);
    box-sizing: border-box;
    z-index: 2;
}

.info::before {
    content: "PERRUNOGT // CACHE SYSTEM";
    display: block;
    margin-bottom: 22px;
    padding-bottom: 12px;
    color: #00ff88;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.16em;
    border-bottom: 1px solid rgba(0, 255, 136, 0.18);
    text-shadow: 0 0 12px rgba(0, 255, 136, 0.55);
}

.info::after {
    content: "";
    display: block;
    width: 70%;
    height: 2px;
    margin: 24px auto 0;
    background: #00ff88;
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.7);
    animation: glow 1.4s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        opacity: 0.35;
        transform: scaleX(0.75);
    }
    to {
        opacity: 1;
        transform: scaleX(1);
    }
}

@media (max-width: 600px) {
    .info {
        width: 88vw;
        padding: 25px 18px;
        font-size: 16px;
    }
    .info::before {
        font-size: 10px;
    }
}
</style>
</head>

<body>
<div id="msgs" class="info">Descargando cache ... 0%</div>

<script>
(function() {
    var msgs = document.getElementById("msgs");
    var ac = window.applicationCache;

    function DLProgress(e) {
        if (e && e.total) {
            var pct = Math.round((e.loaded / e.total) * 100);
            msgs.innerHTML = "Descargando cache ... " + pct + "%";
        } else {
            msgs.innerHTML = "Guardando archivos en cache...";
        }
    }

    function DisplayCacheProgress() {
        try { ac.swapCache(); } catch (err) {}
        msgs.innerHTML = "perrunoGT &middot; Cache OK";
        setTimeout(function() {
            location.replace("index.html" + location.search);
        }, 1500);
    }

    if (!ac) {
        location.replace("index.html" + location.search);
        return;
    }

    ac.addEventListener("progress", DLProgress, false);
    ac.addEventListener("cached", DisplayCacheProgress, false);
    ac.addEventListener("updateready", DisplayCacheProgress, false);

    ac.addEventListener("noupdate", function() {
        msgs.innerHTML = "perrunoGT &middot; Cache al día";
        setTimeout(function() {
            location.replace("index.html" + location.search);
        }, 1000);
    }, false);

    ac.addEventListener("error", function() {
        msgs.innerHTML = "perrunoGT &middot; Cache lista (Offline)";
        setTimeout(function() {
            location.replace("index.html" + location.search);
        }, 1000);
    }, false);
})();
</script>
</body>
</html>
