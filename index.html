<!DOCTYPE html>
<html lang="es" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PERRUNOGT HOST | PS4 Jailbreak</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: #090b0e;
    background: radial-gradient(circle at top, #121824 0%, #08090c 100%);
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card {
    background: rgba(18, 24, 38, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 28px 24px;
    width: 90%;
    max-width: 440px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 210, 255, 0.05);
    text-align: center;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .brand img {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    margin-right: 12px;
    border: 2px solid #00d2ff;
    box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
  }

  .brand b {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.12em;
    background: linear-gradient(135deg, #00d2ff, #3a7bd5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #state {
    font-size: 18px;
    font-weight: 700;
    margin: 12px 0 6px;
    letter-spacing: 0.02em;
    min-height: 26px;
  }

  #det {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 14px;
  }

  #det b {
    color: #f1f5f9;
    font-weight: 600;
  }

  #cache {
    font-size: 12px;
    color: #64748b;
    min-height: 18px;
    font-weight: 500;
  }

  #cache.cacheok { color: #34d399; }
  .ok { color: #34d399; } 
  .bad { color: #f87171; } 
  .warn { color: #fbbf24; }

  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-left: 6px;
    background: rgba(255, 255, 255, 0.05);
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="logo_raw.png" alt="PERRUNOGT Logo" onerror="this.style.display='none'">
    <b>PERRUNOGT HOST</b>
  </div>

  <div id="state">Detectando firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) { 
        stateEl.textContent = t; 
        stateEl.className = c || ""; 
    }
    
    function setCache(t, ok) { 
        cacheEl.textContent = t; 
        cacheEl.className = ok ? "cacheok" : ""; 
    }

    var queryString = location.search || "";
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = /(?:\?|&)force=1(?:&|$)/.test(queryString);
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    detEl.innerHTML = "Firmware: <b>" + (key || "Desconocido") + "</b> " 
        + (supported ? "<span class='status-badge ok'>Soportado</span>" 
                    : "<span class='status-badge bad'>No medido</span>");

    var target = "jb.html" + location.search;

    function go() { 
        setState("Cargando Jailbreak...", "warn"); 
        location.replace(target); 
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("FIRMWARE NO COMPATIBLE", "bad");
        waitForTap("SISTEMA (" + (key || "Desconocido") + ") — Presiona X o toca para forzar", go);
        return;
    }

    var ac = window.applicationCache;

    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
        return;
    }

    // Redirección a cache.html si la cache no se ha guardado aún
    if (ac.status === ac.UNCACHED) {
        setCache("Redirigiendo a instalador de caché...");
        setTimeout(function() {
            location.replace("cache.html" + location.search);
        }, 500);
        return;
    }

    if (ac.status === ac.IDLE) {
        setCache("Modo Offline — Caché lista", true);
        setTimeout(go, 500);
        return;
    }

    ac.addEventListener("noupdate", function () {
        setCache("Modo Offline listo", true);
        go();
    }, false);

    ac.addEventListener("error", function () {
        setCache("Caché lista (Modo Offline)", true);
        setTimeout(go, 500);
    }, false);

    ac.addEventListener("cached", function () {
        setCache("Caché guardada correctamente", true);
        setTimeout(go, 500);
    }, false);

    ac.addEventListener("updateready", function () {
        try { ac.swapCache(); } catch (e) {}
        setCache("Caché actualizada", true);
        setTimeout(go, 500);
    }, false);

})();
</script>
</body>
</html>
